name: Hosted CI
on:
  push:
    branches: [main, algo/ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository metadata
        run: |
          git diff --check
          test -s README.md
          test -s rfcs/0000-decision-process.md
